name: Build PAIGE Desktop for Windows

on:
  push:
    branches: [ stage-2b-checkpoint, main ]
  workflow_dispatch:
    inputs:
      frontend_commit:
        description: Full approved PAIGE frontend main commit SHA
        required: true
        type: string
      merge_pr:
        description: Canonical pull request number for automatic promotion
        required: false
        type: string
      verify_coolify:
        description: Verify the scoped Coolify credential and live domains without deploying
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build:
    if: >-
      github.repository_id == '1474828190' &&
      (startsWith(github.ref, 'refs/heads/main') || github.ref == 'refs/heads/stage-2b-checkpoint') &&
      !inputs.verify_coolify
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          cache-workspaces: src-tauri
      
      - name: Build Windows package
        working-directory: .
        run: node scripts/prepare-github-mcp.mjs && npx tauri build --bundles nsis --features tauri/custom-protocol --config src-tauri/tauri.windows-release.conf.json
      
      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: paige-desktop-windows-installer
          if-no-files-found: error
          path: 'src-tauri/target/release/bundle/nsis/PAIGE Desktop_*.exe'