name: Test PAIGE Desktop (Windows)

on:
  push:
    branches: [ stage-2b-checkpoint, main ]
  pull_request:
    branches: [ stage-2b-checkpoint, main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      matrix:
        include:
          - name: cargo check
            command: cargo check
          - name: cargo test
            command: cargo test --lib
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          profile: minimal
          toolchain: stable
      
      - name: ${{ matrix.name }}
        working-directory: src-tauri
        run: ${{ matrix.command }}