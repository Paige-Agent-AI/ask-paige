[package]
name = "paige-desktop"
version = "0.1.0"
description = "PAIGE Desktop - local multi-agent engineering command center (prototype)"
authors = ["PAIGE Desktop Builder"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "paige_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
ureq = { version = "2", default-features = false, features = ["tls"] }

[features]
default = []
# Test-only: bypasses the native owner-confirmation dialog so automated tests
# can exercise the full write flow. NEVER enable in a production build. The name
# is deliberately alarming; this feature must never be used in a release.
insecure-test-bypass = []


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
